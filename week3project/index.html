<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="main-container first-part">
            <h1>Learn to code by watching others</h1>
            <p>See how experienced developers solve problems in real-time. Watching scripted tutorials is great, but understanding how developers think is invaluable. </p>
        </div>
        <div class="main-container trial-form-container">
            <div class="try-form">
                <span class="font-weight-700">Try it free 7 days</span> then $20/mo. thereafter
            </div>
            <div class="trial-form">
                <form action="/form" method="POST">
                    <input type="text" placeholder="First Name" class="trial-input" name="first_name">
                    <input type="text" placeholder="Last Name" class="trial-input" name="last_name">
                    <input type="email" placeholder="Email Address" class="trial-input" name="email">
                    <input type="password" placeholder="Password" class="trial-input" name="password">

                    <div class="button-and-undertext">
                        <button type="submit" class="trial-submit-button">Claim your free trial</button>
                        <p class="terms-and-services">By clicking the button, you are agreeing to our <span class="terms-and-services-link">Terms and Services</span></p>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
