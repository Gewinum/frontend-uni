<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="selectors.css">
</head>
<body>
    <main>
        <section class="some" id="exact">
            <h1>Section 1 with exact id and class of some</h1>
            <a href="/sadadad" target="_self">oh</a>
        </section>
        <section class="some">
            <h1>Section 2 with class of some</h1>
        </section>
        <section>
            <h1>No class or id</h1>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/EFkyxzJtiv4?si=hpqZsx_LJx_ubxpl" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>
        <section>
            <h1>No class or id</h1>
            <audio controls>
                <source src="audio.mp3" type="audio/mpeg">
                <source src="audio.ogg" type="audio/ogg">
            </audio>
        </section>
        <section>
            <h1>No class or id</h1>
        </section>
    </main>
</body>
</html>
